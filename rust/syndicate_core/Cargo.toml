[package]
name = "syndicate_core"
version = "0.1.0"
edition = "2021"
description = "Syndicate capability agent core compiled to WebAssembly"
license = "ISC"
repository = "https://github.com/ski/syndicate.git"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
getrandom = { version = "0.2", features = ["js"] }
